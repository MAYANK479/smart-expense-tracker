services:
  - type: web
    name: smart-expense-tracker
    env: node
    buildCommand: npm run postinstall && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-tracker-db
          property: connectionString

databases:
  - name: smart-expense-tracker-db
    databaseName: expense_tracker
    user: postgres
